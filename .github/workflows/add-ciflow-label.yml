name: Add ciflow label to pytorch/ao PR

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read

jobs:
  add-label:
    # Skip comments that the bot itself made
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: pytorch/ao
      ALLOWED_LABELS: |
        ciflow/xpu
        ciflow/xpu-periodic
        topic: xpu
        xpu
      # Labels that, when present, will trigger auto-adding companion labels.
      # When any of `ciflow/xpu` or `ciflow/xpu-periodic` is requested, also add `xpu`.
      AUTO_COMPANION_LABEL: "xpu"
      # Optional extra usernames (comma-separated) allowed to trigger labeling,
      # in addition to members of the `pytorch` org.
      EXTRA_AUTHORIZED_USERS: "liangan1,kgajdamo,xiaowangintel,zxd1997066,ugolowic,arlesniak,karol-brejna-i,Stonepia,hoshibara"

    steps:
      - name: Parse request
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            let prNumber = null;
            let labels = [];
            let issueNumber = null;
            let actor = null;

            if (event === 'issues') {
              const issue = context.payload.issue;
              issueNumber = issue.number;
              actor = issue.user.login;

              // Parse the issue form body. Form fields appear as:
              //   ### PR number
              //
              //   1234
              //
              //   ### Labels to add
              //
              //   ciflow/xpu
              const body = issue.body || '';
              const prMatch = body.match(/###\s*PR number\s*\n+\s*([0-9]+)/i);
              const labelMatch = body.match(/###\s*Labels to add\s*\n+\s*([^\n#]+)/i);

              if (prMatch) prNumber = parseInt(prMatch[1], 10);
              if (labelMatch) {
                labels = labelMatch[1].split(',').map(s => s.trim()).filter(Boolean);
              }

              // Fallback: try to extract `#1234` from title
              if (!prNumber) {
                const titleMatch = (issue.title || '').match(/#\s*([0-9]+)/);
                if (titleMatch) prNumber = parseInt(titleMatch[1], 10);
              }
            } else if (event === 'issue_comment') {
              const comment = context.payload.comment;
              issueNumber = context.payload.issue.number;
              actor = comment.user.login;

              // Match: /add-label <pr> <label1>[,<label2>...]
              const m = (comment.body || '').match(
                /^\s*\/add-label\s+([0-9]+)\s+([^\s].*?)\s*$/m
              );
              if (!m) {
                core.info('Comment is not an /add-label command, skipping.');
                core.setOutput('skip', 'true');
                return;
              }
              prNumber = parseInt(m[1], 10);
              labels = m[2].split(',').map(s => s.trim()).filter(Boolean);
            }

            if (!prNumber || labels.length === 0) {
              core.info('No PR number or labels parsed, skipping.');
              core.setOutput('skip', 'true');
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('labels', JSON.stringify(labels));
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('actor', actor);

      - name: Validate labels against allow-list
        if: steps.parse.outputs.skip == 'false'
        id: validate_labels
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = process.env.ALLOWED_LABELS
              .split('\n').map(s => s.trim()).filter(Boolean);
            const requested = JSON.parse('${{ steps.parse.outputs.labels }}');
            const ok = [];
            const bad = [];
            for (const l of requested) {
              if (allowed.includes(l)) ok.push(l);
              else bad.push(l);
            }
            // Auto-append companion `xpu` label whenever any ciflow/xpu* label is added.
            const companion = process.env.AUTO_COMPANION_LABEL;
            if (companion && ok.some(l => l.startsWith('ciflow/xpu')) && !ok.includes(companion)) {
              ok.push(companion);
              core.info(`Auto-added companion label: ${companion}`);
            }
            core.setOutput('ok_labels', JSON.stringify(ok));
            core.setOutput('bad_labels', JSON.stringify(bad));

      - name: Authorize requester
        if: steps.parse.outputs.skip == 'false'
        id: authz
        uses: actions/github-script@v7
        with:
          # Use the elevated token so we can read org membership.
          github-token: ${{ secrets.TORCHAO_PAT }}
          script: |
            const actor = '${{ steps.parse.outputs.actor }}';
            const extras = (process.env.EXTRA_AUTHORIZED_USERS || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            if (extras.includes(actor)) {
              core.info(`Authorized: ${actor} is in EXTRA_AUTHORIZED_USERS.`);
              core.setOutput('authorized', 'true');
              return;
            }

            const [tOwner, tRepo] = process.env.TARGET_REPO.split('/');
            const prNumber = parseInt('${{ steps.parse.outputs.pr_number }}', 10);

            // 1) Allow anyone with triage/write/maintain/admin on the target repo
            //    (i.e. anyone who could manually add the label themselves).
            try {
              const r = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: tOwner, repo: tRepo, username: actor,
              });
              const perm = r.data.permission; // admin|maintain|write|triage|read|none
              if (['admin', 'maintain', 'write', 'triage'].includes(perm)) {
                core.info(`Authorized: ${actor} has '${perm}' on ${tOwner}/${tRepo}.`);
                core.setOutput('authorized', 'true');
                return;
              }
              core.info(`${actor} has only '${perm}' on ${tOwner}/${tRepo}.`);
            } catch (e) {
              core.warning(`getCollaboratorPermissionLevel failed for ${actor}: ${e.message}`);
            }

            // 2) Allow the PR author to label their own PR.
            if (prNumber) {
              try {
                const pr = await github.rest.pulls.get({
                  owner: tOwner, repo: tRepo, pull_number: prNumber,
                });
                if (pr.data.user && pr.data.user.login === actor) {
                  core.info(`Authorized: ${actor} is author of ${tOwner}/${tRepo}#${prNumber}.`);
                  core.setOutput('authorized', 'true');
                  return;
                }
              } catch (e) {
                core.warning(`pulls.get failed: ${e.message}`);
              }
            }

            // 3) Fallback: pytorch org public member.
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: 'pytorch',
                username: actor,
              });
              core.info(`Authorized: ${actor} is a public member of pytorch org.`);
              core.setOutput('authorized', 'true');
              return;
            } catch (e) {
              core.info(`${actor} is not a public member of pytorch org.`);
            }

            core.warning(`User ${actor} is not authorized.`);
            core.setOutput('authorized', 'false');

      - name: Reject unauthorized
        if: steps.parse.outputs.skip == 'false' && steps.authz.outputs.authorized != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.parse.outputs.issue_number }}', 10);
            const actor = '${{ steps.parse.outputs.actor }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `@${actor} sorry, you are not authorized to trigger CI labels.`,
                ``,
                `Authorized requesters are any of:`,
                `- Users with **Triage** or higher permission on \`pytorch/ao\``,
                `- The author of the target PR`,
                `- Public members of the \`pytorch\` GitHub org`,
                `- Users in the workflow's \`EXTRA_AUTHORIZED_USERS\` allow-list`,
              ].join('\n'),
            });
            core.setFailed('Unauthorized requester.');

      - name: Reject bad labels
        if: steps.parse.outputs.skip == 'false' && steps.authz.outputs.authorized == 'true' && steps.validate_labels.outputs.bad_labels != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            const bad = JSON.parse('${{ steps.validate_labels.outputs.bad_labels }}');
            const issueNumber = parseInt('${{ steps.parse.outputs.issue_number }}', 10);
            const allowed = process.env.ALLOWED_LABELS
              .split('\n').map(s => s.trim()).filter(Boolean);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `:x: The following labels are not in the allow-list and were rejected:`,
                ``,
                bad.map(l => `- \`${l}\``).join('\n'),
                ``,
                `Allowed labels:`,
                ``,
                allowed.map(l => `- \`${l}\``).join('\n'),
              ].join('\n'),
            });
            core.setFailed('Some labels are not allowed.');

      - name: Resolve PR head SHA
        if: steps.parse.outputs.skip == 'false' && steps.authz.outputs.authorized == 'true' && steps.validate_labels.outputs.bad_labels == '[]'
        id: pr_sha
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TORCHAO_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            const prNumber = parseInt('${{ steps.parse.outputs.pr_number }}', 10);
            try {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              core.setOutput('sha', pr.data.head.sha);
            } catch (e) {
              core.setFailed(`PR ${owner}/${repo}#${prNumber} not found: ${e.message}`);
            }

      - name: Approve pending workflow runs (pre-label)
        if: steps.pr_sha.outputs.sha
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TORCHAO_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            const sha = '${{ steps.pr_sha.outputs.sha }}';
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: sha, status: 'action_required', per_page: 100,
            });
            core.info(`Found ${runs.length} pending run(s) for ${sha} pre-label.`);
            const approved = [];
            for (const r of runs) {
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', {
                  owner, repo, run_id: r.id,
                });
                approved.push(`${r.name}#${r.id}`);
                core.info(`Approved ${r.name} (${r.id})`);
              } catch (e) {
                core.warning(`Approve ${r.id} failed: ${e.message}`);
              }
            }
            core.setOutput('approved_pre', JSON.stringify(approved));

      - name: Add labels to pytorch/ao PR
        if: steps.parse.outputs.skip == 'false' && steps.authz.outputs.authorized == 'true' && steps.validate_labels.outputs.bad_labels == '[]'
        id: add
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TORCHAO_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            const prNumber = parseInt('${{ steps.parse.outputs.pr_number }}', 10);
            const labels = JSON.parse('${{ steps.validate_labels.outputs.ok_labels }}');

            // Remove labels that already exist on the PR so re-adding them
            // generates a fresh "labeled" event and re-triggers CI.
            const existing = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existingNames = new Set(existing.data.map(l => l.name));
            for (const label of labels) {
              if (existingNames.has(label)) {
                core.info(`Removing existing label '${label}' to re-trigger CI.`);
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: prNumber, name: label,
                  });
                } catch (e) {
                  core.warning(`Failed to remove label '${label}': ${e.message}`);
                }
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels,
            });
            core.setOutput('added', JSON.stringify(labels));

      - name: Approve workflow runs triggered by the new label
        if: steps.add.outputs.added && steps.pr_sha.outputs.sha
        id: approve_post
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TORCHAO_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            const sha = '${{ steps.pr_sha.outputs.sha }}';
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            // Poll up to ~3 minutes for new action_required runs to appear,
            // approving each as we see them.
            const seen = new Set();
            const approved = [];
            const deadline = Date.now() + 3 * 60 * 1000;
            while (Date.now() < deadline) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: sha, status: 'action_required', per_page: 100,
              });
              for (const r of runs) {
                if (seen.has(r.id)) continue;
                seen.add(r.id);
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', {
                    owner, repo, run_id: r.id,
                  });
                  approved.push(`${r.name}#${r.id}`);
                  core.info(`Approved ${r.name} (${r.id})`);
                } catch (e) {
                  core.warning(`Approve ${r.id} failed: ${e.message}`);
                }
              }
              await sleep(15000);
            }
            core.setOutput('approved_post', JSON.stringify(approved));

      - name: Comment success and close issue
        if: success() && steps.parse.outputs.skip == 'false' && steps.add.outputs.added
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.parse.outputs.issue_number }}', 10);
            const prNumber = parseInt('${{ steps.parse.outputs.pr_number }}', 10);
            const labels = JSON.parse('${{ steps.add.outputs.added }}');
            const actor = '${{ steps.parse.outputs.actor }}';
            let approvedPost = [];
            try { approvedPost = JSON.parse(`${{ steps.approve_post.outputs.approved_post || '[]' }}`); } catch (e) {}

            const lines = [
              `:white_check_mark: @${actor}, added the following labels to`,
              `[pytorch/ao#${prNumber}](https://github.com/pytorch/ao/pull/${prNumber}):`,
              ``,
              labels.map(l => `- \`${l}\``).join('\n'),
            ];
            if (approvedPost.length > 0) {
              lines.push('');
              lines.push(`Approved ${approvedPost.length} workflow run(s) triggered by the new label.`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: lines.join('\n'),
            });

            // Only close if the trigger was an issue (not a comment)
            if (context.eventName === 'issues') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Comment failure
        if: failure() && steps.parse.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.parse.outputs.issue_number }}', 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `:x: Failed to add labels. See [workflow run](${runUrl}) for details.`,
            });
